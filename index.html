<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coulomb Canvas</title>
  <link rel="stylesheet" href="styles.css" />
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

</head>

<body>
  <header>
  </header>

  <div id="topic-container"></div>

  <div class="circle-wrapper">
    <div class="circle-center">
      <img src="images/Avatar/Avatar.png" alt="Center" />
    </div>

    <div class="circle-menu" id="topic-container">
      <!-- Topic image buttons will go here via JS -->
    </div>
  </div>

  <div style="position: relative; width:1000px; height:auto;">
    <img id="logo" src="images/logo.png"/>
  </div>

  <div id="year-navigation-buttons">  
    <button id="previous-year-button">← Back</button>
    <button id="next-year-button">Next </button>
  </div>


  <script src="data/topics.js"></script>
  <script>
    document.body.style.overflow = "hidden";
    const topicContainer = document.getElementById("topic-container");
    let year = 1;
    let radius = 320;

    const mq = window.matchMedia("(max-width: 100vh)");
    function updateRadiusAndLayout() {
          if (mq.matches) {
            radius = window.innerWidth / 2.4;

          } else {
            radius = window.innerHeight / 2.421875; //320;
          }}
    
    document.addEventListener("DOMContentLoaded", () => {
      function reset() {
        const topicContainer = document.getElementById("topic-container");
        const numberOfTopics = topics.filter(t => t.subyear === year).length;
        
        const mq = window.matchMedia("(max-width: 100vh)");

        // REMOVE OLD ELEMENTS:
        topicContainer.innerHTML = "";
        updateRadiusAndLayout();

        // Now re-generate/render your elements with the new radius:
        topics.forEach((topic, index) => {
          if (topic.subyear == year) {
            const angle = ((index / numberOfTopics) * (2 * Math.PI)) - (Math.PI / 2);
            const x = Math.cos(angle) * radius;
            const y = Math.sin(angle) * radius;

            const link = document.createElement("a");
            link.href = `topic.html?topic=${topic.id}&year=${topic.subyear}`;
            link.classList.add("topic-image-link");
            link.style.left = `calc(50vw + ${x}px)`; // 40px = half image width
            link.style.transform = 'translateX(-50%) translateY(-50%)';
            link.style.top = `calc(50vh + ${y}px`;

            const img = document.createElement("img");
            img.src = topic.image;
            img.alt = topic.title;
            img.classList.add("topic-image");

            
            const titleOverlay = document.createElement("div");
            titleOverlay.classList.add("topic-title");
            titleOverlay.textContent = topic.title;

            link.appendChild(img);
            link.appendChild(titleOverlay);
            topicContainer.appendChild(link);

          }

        });
      }
      reset()
      

      // Hook to resize and media query changes:
      window.addEventListener("resize", updateRadiusAndLayout);
      mq.addEventListener("change", updateRadiusAndLayout);

      // Initial render:
      updateRadiusAndLayout();
      reset()

      // Year buttons:
      const urlParams = new URLSearchParams(window.location.search);
      const subtopicYear = urlParams.get("subyear");
      const nextYearButton = document.getElementById("next-year-button");
      const prevYearButton = document.getElementById("previous-year-button")

      prevYearButton.style.display = "none"
      const suffix = ["st", "nd", "rd", "th"]

      function setYears() {
          nextYearButton.textContent = year+1 + suffix[year] + " year"
          prevYearButton.textContent = year-1 + suffix[year-2] + " year"
      };
      setYears();


      if (nextYearButton) {
        nextYearButton.addEventListener("click", () => {
          year = year + 1;
          setYears();
          console.log(year)
          reset()
          if (year > 1) {
            prevYearButton.style.display = "inline-block"
          }
          if (year == 4) {
            nextYearButton.style.display = "none"
          }
        })
      }


      if (prevYearButton) {
        prevYearButton.addEventListener("click", () => {
          year = year - 1;
          setYears();
          reset()
          console.log(year)
          if (year < 4) {
            nextYearButton.style.display = "inline-block"
          }
          if (year == 1) {
            prevYearButton.style.display = "none"
          }
        })
      }


      




    });




  </script>

</body>

</html>
